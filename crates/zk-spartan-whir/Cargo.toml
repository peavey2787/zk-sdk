[package]
name = "zk-spartan-whir"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Spartan-WHIR full-ZK backend, linked directly as a library (native and wasm32)"

[dependencies]
zk-core = { path = "../zk-core" }
spartan-whir.workspace = true
p3-field = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
p3-koala-bear = { git = "https://github.com/Client-Side-Proving/Plonky3.git", rev = "458ef546a251ab4d9d73c453d24a414334786ca0" }
serde.workspace = true
bincode.workspace = true
web-time.workspace = true

# Native builds use every core; wasm32 stays single-threaded (no shared memory assumed).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spartan-whir = { workspace = true, features = ["parallel"] }
