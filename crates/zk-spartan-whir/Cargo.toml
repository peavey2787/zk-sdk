[package]
name = "zk-spartan-whir"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Spartan-WHIR full-ZK backend, linked directly as a library (native and wasm32)"

[dependencies]
zk-core = { path = "../zk-core" }
spartan-whir.workspace = true
p3-field.workspace = true
p3-koala-bear.workspace = true
serde.workspace = true
bincode.workspace = true
web-time.workspace = true

[features]
# Multi-threaded proving on wasm32 (shared memory; see scripts/build_wasm.py). Native always is.
parallel = ["spartan-whir/parallel"]

# Native builds use every core; wasm32 is single-threaded unless built with `parallel`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spartan-whir = { workspace = true, features = ["parallel"] }
