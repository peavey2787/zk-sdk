name: Validation
on:
  push:
  pull_request:
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack cargo-audit --locked
      - name: Pinned nightly for the threaded WASM bundle (scripts/build_wasm.py)
        run: rustup toolchain install nightly-2026-09-25 --profile minimal --component rust-src
      - name: Published Groth16 phase-1 file (re-checked against its published hash on every run)
        uses: actions/cache@v4
        with:
          path: target/ptau
          key: ptau-hez-final-14
      - name: Full validation (ephemeral Groth16 setups for representative circuits)
        shell: bash
        run: python scripts/run_all.py full
  groth16-all:
    # Every Groth16 circuit through the snarkjs reference check: starting keys, contributions,
    # beacons and verification in both directions. No key is stored; each run makes its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: target/ptau
          key: ptau-hez-final-14
      - name: All 45 Groth16 circuits against snarkjs
        shell: bash
        run: python scripts/run_all.py groth16-all
  performance:
    # Latency regression gate, deliberately separate from the security/correctness gate above.
    # A miss is reported here; it never lowers a parameter and never blocks correctness results.
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - name: Pinned nightly for the threaded WASM bundle (scripts/build_wasm.py)
        run: rustup toolchain install nightly-2026-09-25 --profile minimal --component rust-src
      - name: Performance gates (native and browser)
        shell: bash
        run: python scripts/run_all.py perf
