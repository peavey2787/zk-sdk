[package]
name = "zk-groth16"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Groth16 over BN254 (arkworks curves) for the built-in predicates: snarkjs zkeys from a public Powers of Tau plus a documented phase-2 contribution"

[dependencies]
zk-witness = { path = "../zk-witness" }
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-poly.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
getrandom = "0.4"
light-poseidon.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
parallel = ["ark-ec/parallel", "ark-ff/parallel", "ark-poly/parallel", "ark-std/parallel"]

# Native builds use every core; wasm32 is single-threaded unless built with `parallel`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ark-ec = { workspace = true, features = ["parallel"] }
ark-ff = { workspace = true, features = ["parallel"] }
ark-poly = { workspace = true, features = ["parallel"] }
ark-std = { workspace = true, features = ["parallel"] }
